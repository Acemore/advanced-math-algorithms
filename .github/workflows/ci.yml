name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache Mypy incremental runtime directory
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-mypy-

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

      - name: Run test suite
        run: uv run pytest
